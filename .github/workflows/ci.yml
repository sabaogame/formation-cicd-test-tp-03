name: Java CI

on: [push, pull_request]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package
        run: |
          mvn -q clean package

      - name: Start app
        run: |
          java -jar target/formation-cicd-test-tp-03-solution-1.0-SNAPSHOT.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid]; then
            kill $(cat app.pid) && echo "App stopped" || echo "Process already stopped"
          fi